[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dnslogsqlinj3"
version = "3.0.0"
description = "DnslogSqlinj 3 - modern DNS out-of-band SQL injection tool (single file, zero dependencies)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DnslogSqlinj3 contributors" }]
keywords = ["sql-injection", "dnslog", "oob", "pentest", "sqli", "dns-exfiltration"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
dnslogsqlinj3 = "dnslogsqlinj3:main"

[project.urls]
Homepage = "https://github.com/Pluck9527/dnslogsqlinj3"
Source = "https://github.com/Pluck9527/dnslogsqlinj3"

[tool.setuptools]
py-modules = ["dnslogsqlinj3"]
